name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write

jobs:
  meta:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

  build-arch:
    name: Linux Arch (.pkg.tar.zst)
    needs: meta
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            if pacman -Syu --noconfirm --needed \
              base-devel cmake ninja pkgconf git python curl \
              sdl3 sdl3_ttf ffmpeg libpng libjpeg-turbo libwebp \
              opus libsodium openssl zlib speexdsp nlohmann-json \
              libpipewire libx11 libxext libxcomposite libxrandr libxfixes \
              glib2 dbus fontconfig zstd; then
              break
            fi
            echo "pacman install attempt ${attempt} failed; retrying..."
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
      - uses: actions/checkout@v4
      - name: Build & Package Arch (.pkg.tar.zst + repo DB)
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCCORD_WERROR=ON \
            -DCCORD_BUILD_TESTS=OFF \
            -DCCORD_VERSION="${VER}"
          cmake --build build --parallel "$(nproc)"
          DESTDIR="$PWD/pkgstage" cmake --install build
          ln -sf ccord pkgstage/usr/bin/c-cord

          # Build native Arch package (.pkg.tar.zst) with accurate .PKGINFO
          ISIZE=$(du -sb pkgstage | awk '{print $1}')
          BDATE=$(date +%s)
          cat <<EOF > pkgstage/.PKGINFO
          pkgname = c-cord
          pkgbase = c-cord
          pkgver = ${VER}-1
          pkgdesc = Fast, lightweight native C23 Discord client
          url = https://c-cord.org
          builddate = ${BDATE}
          packager = C-Cord Release CI <packages@c-cord.org>
          size = ${ISIZE}
          arch = x86_64
          license = AGPL-3.0-only
          depend = sdl3
          depend = sdl3_ttf
          depend = ffmpeg
          depend = curl
          depend = openssl
          depend = opus
          depend = libsodium
          depend = speexdsp
          depend = libpng
          depend = libjpeg-turbo
          depend = libwebp
          depend = zlib
          depend = fontconfig
          optdepend = pipewire: Wayland screen capture and loopback audio
          optdepend = xdg-desktop-portal: Wayland screen sharing and global shortcuts
          EOF

          mkdir -p out/assets out/repo-meta/arch/x86_64
          PKG="c-cord-${VER}-1-x86_64.pkg.tar.zst"
          (cd pkgstage && bsdtar -cf - .PKGINFO usr | zstd -19 -T0 -o "$OLDPWD/out/assets/${PKG}")
          cp "out/assets/${PKG}" "out/repo-meta/arch/x86_64/${PKG}"
          (cd out/repo-meta/arch/x86_64 && repo-add c-cord.db.tar.gz "${PKG}" && rm -f "${PKG}" c-cord.db c-cord.files *.old)
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: out/

  build-deb:
    name: Linux Debian/Ubuntu (.deb)
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          # Deliberately omit libcurl4-openssl-dev, libav*-dev, libsw*-dev, and libjpeg*-dev:
          # those ABI-divergent deps are built statically via packaging/deb/build_static_deps.sh
          # so one .deb works across Debian 12/13 and Ubuntu 24.04/26.04 (and derivatives).
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            ca-certificates git curl bzip2 xz-utils binutils make perl clang-19 cmake ninja-build meson nasm yasm pkg-config python3 dpkg-dev \
            libssl-dev zlib1g-dev libnghttp2-dev \
            libpng-dev libwebp-dev \
            libopus-dev libsodium-dev libspeexdsp-dev nlohmann-json3-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev \
            libva-dev libdrm-dev libgbm-dev \
            libpipewire-0.3-dev libglib2.0-dev libdbus-1-dev \
            libx11-dev libxext-dev libxcomposite-dev libxrandr-dev libxfixes-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libgl-dev libegl-dev libasound2-dev libpulse-dev
      - uses: actions/checkout@v4
      - name: Cache static Linux .deb dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccord-deb-deps
          key: deb-static-deps-bookworm-${{ hashFiles('packaging/deb/build_static_deps.sh') }}
      - name: Build minimal static FFmpeg, libjpeg-turbo, and libcurl (WebSockets)
        run: |
          CC=clang-19 CXX=clang++-19 ./packaging/deb/build_static_deps.sh "${HOME}/.cache/ccord-deb-deps"
      - name: Build & Package Debian (.deb + APT metadata)
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          ROOT="$PWD"
          DEPS_PREFIX="${HOME}/.cache/ccord-deb-deps"
          export PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib/ccord' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_PREFIX_PATH="${DEPS_PREFIX}" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--as-needed" \
            -DCCORD_DEPS=fetch \
            -DCCORD_WERROR=OFF \
            -DCCORD_BUILD_TESTS=OFF \
            -DCCORD_VERSION="${VER}"
          cmake --build build --parallel "$(nproc)"
          DESTDIR="$ROOT/debstage" cmake --install build
          ln -sf ccord debstage/usr/bin/c-cord

          # Bundle fetched SDL3 & SDL3_ttf shared libraries alongside the statically linked FFmpeg/libjpeg/libcurl.
          mkdir -p debstage/usr/lib/ccord debstage/DEBIAN
          cp -av build/_deps/sdl3-build/libSDL3.so.* debstage/usr/lib/ccord/
          cp -av build/_deps/sdl3_ttf-build/libSDL3_ttf.so.* debstage/usr/lib/ccord/
          rm -f debstage/usr/lib/ccord/*.a

          # Assert none of the distro-divergent media/network libraries leaked into DT_NEEDED.
          echo "=== ccord DT_NEEDED ==="
          readelf -d debstage/usr/bin/ccord | grep '(NEEDED)' || true
          if readelf -d debstage/usr/bin/ccord | grep -E 'NEEDED.*lib(avformat|avcodec|avutil|swscale|swresample|jpeg|curl|x264|vpx|dav1d)\.so'; then
            echo "ERROR: ccord dynamically linked a library that must be statically linked for cross-distro .deb compatibility" >&2
            exit 1
          fi

          # Compute exact runtime Depends via dpkg-shlibdeps, then map only the 4 ABI-identical amd64 t64 renames.
          mkdir -p shlibswork/debian
          cat <<'EOF' > shlibswork/debian/control
          Source: c-cord

          Package: c-cord
          Architecture: amd64
          EOF
          : > shlibswork/debian/shlibs.local
          SHLIB_TARGETS=(
            "$ROOT/debstage/usr/bin/ccord"
            "$ROOT/debstage/usr/bin/ccord-plugin-host"
          )
          for so in "$ROOT"/debstage/usr/lib/ccord/libSDL3.so.* "$ROOT"/debstage/usr/lib/ccord/libSDL3_ttf.so.*; do
            [ -f "$so" ] && [ ! -L "$so" ] || continue
            soname=$(readelf -d "$so" | sed -n 's/.*(SONAME).*Library soname: \[\(.*\)\]/\1/p')
            if [ -z "$soname" ]; then
              echo "ERROR: could not extract SONAME from $so" >&2
              exit 1
            fi
            libbase="${soname%.so.*}"
            libver="${soname#*.so.}"
            echo "${libbase} ${libver} c-cord" >> shlibswork/debian/shlibs.local
            SHLIB_TARGETS+=("$so")
          done
          test -s shlibswork/debian/shlibs.local
          SHLIBS_OUT=$(cd shlibswork && dpkg-shlibdeps -O -xc-cord \
            -l"$ROOT/debstage/usr/lib/ccord" \
            "${SHLIB_TARGETS[@]}")
          RAW_DEPS=$(printf '%s\n' "$SHLIBS_OUT" | sed -n 's/^shlibs:Depends=//p')
          if [ -z "$RAW_DEPS" ]; then
            echo "ERROR: dpkg-shlibdeps failed to compute Depends (output: ${SHLIBS_OUT})" >&2
            exit 1
          fi
          DEB_DEPS=$(python3 - "$RAW_DEPS" <<'PY'
          import re, sys
          t64_map = {
              "libssl3": "libssl3t64",
              "libpng16-16": "libpng16-16t64",
              "libpipewire-0.3-0": "libpipewire-0.3-0t64",
              "libglib2.0-0": "libglib2.0-0t64",
          }
          out = []
          for item in (x.strip() for x in sys.argv[1].split(",") if x.strip()):
              m = re.match(r"^([a-z0-9.+-]+)(\s*\([^)]+\))?$", item)
              if m and m.group(1) in t64_map:
                  pkg, ver = m.group(1), (m.group(2) or "")
                  out.append(f"{t64_map[pkg]}{ver} | {pkg}{ver}")
              else:
                  out.append(item)
          out.append("ca-certificates")
          print(", ".join(out))
          PY
          )
          echo "Computed cross-distro Depends: ${DEB_DEPS}"

          ISIZE_KB=$(du -sk debstage/usr | awk '{print $1}')
          cat <<EOF > debstage/DEBIAN/control
          Package: c-cord
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Installed-Size: ${ISIZE_KB}
          Maintainer: C-Cord Contributors <packages@c-cord.org>
          Homepage: https://c-cord.org
          Depends: ${DEB_DEPS}
          Recommends: pipewire, xdg-desktop-portal
          Description: Fast, lightweight native C23 Discord client
           Native desktop Discord client written in C23 with built-in themes,
           hardware-accelerated screen sharing, and sandboxed Lua plugins.
          EOF
          cat <<'EOF' > debstage/DEBIAN/postinst
          #!/bin/sh
          set -e
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database /usr/share/applications || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          EOF
          chmod 0755 debstage/DEBIAN/postinst

          mkdir -p out/assets out/repo-meta/deb/dists/stable/main/binary-amd64
          DEB="c-cord_${VER}_amd64.deb"
          dpkg-deb --root-owner-group --build debstage "out/assets/${DEB}"
          ls -lh "out/assets/${DEB}"

          # Generate APT Packages index pointing to pool/main/c/c-cord/<deb>
          mkdir -p aptwork/pool/main/c/c-cord
          cp "out/assets/${DEB}" "aptwork/pool/main/c/c-cord/${DEB}"
          (cd aptwork && dpkg-scanpackages --multiversion pool/ > "$ROOT/out/repo-meta/deb/dists/stable/main/binary-amd64/Packages")
      - uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: out/

  test-deb:
    name: Verify .deb (${{ matrix.image }})
    needs: [meta, build-deb]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm
          - ubuntu:24.04
          - debian:trixie
          - ubuntu:26.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-deb
          path: deb-art
      - name: Install & smoke-test .deb on ${{ matrix.image }}
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          DEB="c-cord_${VER}_amd64.deb"
          cp "deb-art/assets/${DEB}" "/tmp/${DEB}"
          chmod 0644 "/tmp/${DEB}"
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y "/tmp/${DEB}"
          for bin in /usr/bin/ccord /usr/bin/ccord-plugin-host; do
            echo "=== ldd ${bin} (${{ matrix.image }}) ==="
            LDD_OUT=$(ldd "${bin}" 2>&1)
            printf '%s\n' "${LDD_OUT}"
            if printf '%s\n' "${LDD_OUT}" | grep -qiE 'not found'; then
              echo "ERROR: unresolved shared library or symbol version in ${bin} on ${{ matrix.image }}" >&2
              exit 1
            fi
          done
          /usr/bin/c-cord --version
          (cd /tmp && SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy /usr/bin/c-cord --headless --mock --data-dir /tmp/smoke-data --screenshot /tmp/smoke.png)
          test -s /tmp/smoke.png

  build-rpm:
    name: Linux Fedora/RPM (.rpm)
    needs: meta
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            if dnf install -y \
              gcc gcc-c++ cmake ninja-build pkgconf-pkg-config python3 rpm-build createrepo_c \
              SDL3-devel SDL3_ttf-devel \
              ffmpeg-free-devel libcurl-devel openssl-devel zlib-devel \
              libpng-devel libjpeg-turbo-devel libwebp-devel \
              opus-devel libsodium-devel speexdsp-devel json-devel \
              pipewire-devel glib2-devel dbus-devel fontconfig-devel \
              libX11-devel libXext-devel libXcomposite-devel libXrandr-devel libXfixes-devel; then
              break
            fi
            echo "dnf install attempt ${attempt} failed; retrying..."
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
      - uses: actions/checkout@v4
      - name: Build & Package RPM (.rpm + repodata)
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCCORD_WERROR=OFF \
            -DCCORD_BUILD_TESTS=OFF \
            -DCCORD_VERSION="${VER}"
          cmake --build build --parallel "$(nproc)"
          DESTDIR="$PWD/rpmstage" cmake --install build
          ln -sf ccord rpmstage/usr/bin/c-cord

          RPM_VER=$(echo "${VER}" | tr '-' '~')
          mkdir -p "$PWD/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb packaging/rpm/c-cord.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "ccord_version ${RPM_VER}" \
            --define "ccord_stage $PWD/rpmstage"

          mkdir -p out/assets out/repo-meta/rpm/x86_64
          RPM_SRC=$(find rpmbuild/RPMS/x86_64 -name '*.rpm' | head -n1)
          RPM_NAME="c-cord-${RPM_VER}-1.x86_64.rpm"
          cp "${RPM_SRC}" "out/assets/${RPM_NAME}"

          mkdir -p rpmrepo/packages
          cp "out/assets/${RPM_NAME}" "rpmrepo/packages/${RPM_NAME}"
          createrepo_c --simple-md-filenames rpmrepo
          cp -a rpmrepo/repodata out/repo-meta/rpm/x86_64/repodata
      - uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: out/

  build-appimage:
    name: Linux AppImage (.AppImage)
    needs: meta
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            ca-certificates git curl gcc g++ cmake ninja-build pkg-config python3 file \
            libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libpng-dev libjpeg62-turbo-dev libwebp-dev \
            libopus-dev libsodium-dev libspeexdsp-dev nlohmann-json3-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev \
            libpipewire-0.3-dev libglib2.0-dev libdbus-1-dev \
            libx11-dev libxext-dev libxcomposite-dev libxrandr-dev libxfixes-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libgl-dev libegl-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev
      - uses: actions/checkout@v4
      - name: Build & Package AppImage
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCCORD_DEPS=fetch \
            -DCCORD_WERROR=OFF \
            -DCCORD_BUILD_TESTS=OFF \
            -DCCORD_VERSION="${VER}"
          cmake --build build --parallel "$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build
          mkdir -p AppDir/usr/lib

          cp -av build/_deps/sdl3-build/libSDL3.so* AppDir/usr/lib/
          cp -av build/_deps/sdl3_ttf-build/libSDL3_ttf.so* AppDir/usr/lib/

          # Bundle non-base shared libraries (keep libc/libm/libGL/libwayland/libX11/libpipewire/libstdc++ from host).
          for bin in AppDir/usr/bin/ccord AppDir/usr/bin/ccord-plugin-host; do
            LD_LIBRARY_PATH="$PWD/AppDir/usr/lib" ldd "$bin" | awk '/=> \// {print $3}' | while read -r lib; do
              case "$lib" in
                "$PWD/AppDir"*) continue ;;
              esac
              base=$(basename "$lib")
              case "$base" in
                libc.so*|libm.so*|libdl.so*|librt.so*|libpthread.so*|libgcc_s.so*|libstdc++.so*|ld-linux*|libresolv.so*|\
                libGL*|libEGL*|libGLX*|libdrm*|libgbm*|libvulkan*|libwayland*|libX11*|libXext*|libXcomposite*|libXrandr*|libXfixes*|libxcb*|libxkbcommon*|\
                libasound*|libpulse*|libpipewire*|libdbus*|libglib*|libgio*|libgobject*|libgmodule*|libfontconfig*|libfreetype*|libharfbuzz*|libexpat*|libz.so*)
                  continue ;;
              esac
              cp -nL "$lib" AppDir/usr/lib/ || true
            done
          done

          cp assets/icons/C-Cord.desktop AppDir/C-Cord.desktop
          cp assets/icons/ccord-256.png AppDir/C-Cord.png
          ln -sf C-Cord.png AppDir/.DirIcon
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH:-}"
          export CCORD_ASSET_DIR="${HERE}/usr/share/ccord"
          export CCORD_PLUGIN_HOST="${HERE}/usr/bin/ccord-plugin-host"
          exec "${HERE}/usr/bin/ccord" "$@"
          EOF
          chmod 0755 AppDir/AppRun

          curl -fsSL --retry 3 --retry-delay 5 "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          mkdir -p out/assets
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "out/assets/C-Cord-${VER}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: out/

  build-flatpak:
    name: Linux Flatpak (.flatpak + custom repo)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Flatpak toolchain
        timeout-minutes: 15
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            flatpak flatpak-builder ostree elfutils debugedit ca-certificates desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          for attempt in 1 2 3; do
            if timeout 300 flatpak install --user --noninteractive --no-related -y \
                 flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08; then
              break
            fi
            echo "flatpak install attempt ${attempt} failed or timed out; retrying..."
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
      - uses: actions/checkout@v4
      - name: Build Flatpak bundle & custom OSTree repo with static delta
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          sed -i "s/-DCCORD_BUILD_TESTS=OFF/-DCCORD_BUILD_TESTS=OFF\n      - -DCCORD_VERSION=${VER}/" packaging/flatpak/org.ccord.CCord.yml
          flatpak-builder --user --force-clean --state-dir=/tmp/fp-state --default-branch=stable --repo=/tmp/fp-repo /tmp/fp-build packaging/flatpak/org.ccord.CCord.yml
          # Generate a single-part, zero-fallback static delta for the app so 100% of app files live in delta/0
          # (no large fallback .filez fetches from c-cord.org) and index it into the summary.
          ostree --repo=/tmp/fp-repo static-delta generate --empty --min-fallback-size=0 --max-chunk-size=128 --to=app/org.ccord.CCord/x86_64/stable
          flatpak build-update-repo /tmp/fp-repo

          mkdir -p out/assets
          # 1. Standalone single-file bundle
          flatpak build-bundle /tmp/fp-repo "out/assets/C-Cord-${VER}-linux-x86_64.flatpak" org.ccord.CCord stable

          # 2. Extract app static delta part 0 for GitHub Releases storage (c-cord.org 302-redirects delta/0 here)
          APP_COMMIT=$(ostree --repo=/tmp/fp-repo rev-parse app/org.ccord.CCord/x86_64/stable)
          APP_DELTA_DIR=$(python3 -c 'import base64,sys; b=base64.b64encode(bytes.fromhex(sys.argv[1].strip())).decode().rstrip("=").replace("/","_"); print(f"{b[:2]}/{b[2:]}")' "$APP_COMMIT")
          DELTA_PART="/tmp/fp-repo/deltas/${APP_DELTA_DIR}/0"
          echo "Flatpak app commit=${APP_COMMIT} delta=${APP_DELTA_DIR}"
          ostree --repo=/tmp/fp-repo static-delta show "$APP_COMMIT" | head -n 20
          ls -lh "/tmp/fp-repo/deltas/${APP_DELTA_DIR}/"
          test -f "$DELTA_PART"
          test ! -f "/tmp/fp-repo/deltas/${APP_DELTA_DIR}/1"
          cp "$DELTA_PART" "out/assets/ccord-flatpak-delta-0.bin"

          # Pack lightweight OSTree metadata without the heavy app delta/0 or app .filez objects (keep tiny appstream objects).
          rm -rf /tmp/fp-repo-meta
          cp -a /tmp/fp-repo /tmp/fp-repo-meta
          rm -f "/tmp/fp-repo-meta/deltas/${APP_DELTA_DIR}/0"
          python3 - <<'PY'
          import os, subprocess
          repo = "/tmp/fp-repo-meta"
          keep = set()
          for ref in ("appstream/x86_64", "appstream2/x86_64"):
              out = subprocess.check_output(["ostree", f"--repo={repo}", "ls", "-RC", ref], text=True)
              for line in out.splitlines():
                  parts = line.split()
                  if len(parts) >= 5 and parts[0][0] in ("-", "l"):
                      keep.add(parts[4])
          removed = 0
          for root, _, files in os.walk(os.path.join(repo, "objects")):
              prefix = os.path.basename(root)
              for fn in files:
                  if fn.endswith(".filez"):
                      oid = prefix + fn[:-6]
                      if oid not in keep:
                          os.remove(os.path.join(root, fn))
                          removed += 1
          print(f"Pruned {removed} app .filez objects; kept {len(keep)} appstream objects")
          PY
          tar -czf "out/assets/ccord-flatpak-repo.tar.gz" -C /tmp/fp-repo-meta .
          ls -lh out/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: out/

  build-windows:
    name: Windows (x86_64 Installer + Portable ZIP)
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-sdl3-ttf
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-libjpeg-turbo
            mingw-w64-clang-x86_64-libwebp
            mingw-w64-clang-x86_64-opus
            mingw-w64-clang-x86_64-libsodium
            mingw-w64-clang-x86_64-curl
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-speexdsp
            zip
      - name: Build & Bundle Windows binaries + DLLs
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCCORD_WERROR=ON \
            -DCCORD_BUILD_TESTS=OFF \
            -DCCORD_VERSION="${VER}" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage-win"
          cmake --build build-win --parallel "$(nproc)"
          cmake --install build-win

          mkdir -p dist-win/assets out/assets
          cp stage-win/bin/ccord.exe dist-win/
          cp stage-win/bin/ccord-plugin-host.exe dist-win/
          cp -r stage-win/share/ccord/* dist-win/assets/

          # Collect full transitive closure of CLANG64 runtime DLLs
          collect_dlls() {
            local changed=1
            while [ "$changed" -eq 1 ]; do
              changed=0
              for f in dist-win/*.exe dist-win/*.dll; do
                [ -f "$f" ] || continue
                while read -r dll; do
                  [ -n "$dll" ] || continue
                  base=$(basename "$dll")
                  if [ ! -f "dist-win/$base" ]; then
                    cp -f "$dll" "dist-win/$base"
                    changed=1
                  fi
                done < <(ldd "$f" | awk '/=> \/clang64\/bin\// {print $3}')
              done
            done
          }
          collect_dlls
          echo "Bundled $(ls dist-win/*.dll 2>/dev/null | wc -l) CLANG64 runtime DLLs"

          (cd dist-win && zip -r -9 "$OLDPWD/out/assets/C-Cord-${VER}-windows-x86_64-portable.zip" .)
      - name: Build Windows Installer (.exe via Inno Setup)
        shell: pwsh
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DCCordVersion=$env:VER" "/DCCordDistDir=$(Resolve-Path dist-win)" "/DCCordOutDir=$(Resolve-Path out\assets)" packaging\windows\ccord.iss
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/

  build-macos:
    name: macOS (Apple Silicon .dmg)
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install llvm cmake ninja pkg-config dylibbundler \
              sdl3 sdl3_ttf ffmpeg libpng jpeg-turbo webp opus libsodium curl openssl@3 nlohmann-json speexdsp; then
              break
            fi
            echo "brew install attempt ${attempt} failed; retrying..."
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
      - name: Build & Package macOS C-Cord.app + .dmg
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$(brew --prefix openssl@3):$(brew --prefix curl):$(brew --prefix)"
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DCMAKE_OBJC_COMPILER="/usr/bin/clang" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCCORD_WERROR=ON \
            -DCCORD_BUILD_TESTS=OFF \
            -DCCORD_VERSION="${VER}" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage-macos"
          cmake --build build-macos --parallel "$(sysctl -n hw.ncpu)"
          cmake --install build-macos

          APP="$PWD/dmg-stage/C-Cord.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp stage-macos/bin/ccord "$APP/Contents/MacOS/ccord"
          cp stage-macos/bin/ccord-plugin-host "$APP/Contents/MacOS/ccord-plugin-host"
          cp stage-macos/share/ccord/Info.plist "$APP/Contents/Info.plist"
          cp -r stage-macos/share/ccord/fonts stage-macos/share/ccord/themes stage-macos/share/ccord/extensions "$APP/Contents/Resources/"

          # Generate macOS .icns app icon from bundled PNGs
          ICONSET="$PWD/C-Cord.iconset"
          mkdir -p "$ICONSET"
          cp assets/icons/ccord-16.png "$ICONSET/icon_16x16.png"
          cp assets/icons/ccord-32.png "$ICONSET/icon_16x16@2x.png"
          cp assets/icons/ccord-32.png "$ICONSET/icon_32x32.png"
          cp assets/icons/ccord-64.png "$ICONSET/icon_32x32@2x.png"
          cp assets/icons/ccord-128.png "$ICONSET/icon_128x128.png"
          cp assets/icons/ccord-256.png "$ICONSET/icon_128x128@2x.png"
          cp assets/icons/ccord-256.png "$ICONSET/icon_256x256.png"
          cp assets/icons/ccord-512.png "$ICONSET/icon_256x256@2x.png"
          cp assets/icons/ccord-512.png "$ICONSET/icon_512x512.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/C-Cord.icns"

          # Bundle and relocate all Homebrew dylibs into C-Cord.app/Contents/Frameworks
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/ccord" \
            -x "$APP/Contents/MacOS/ccord-plugin-host" \
            -d "$APP/Contents/Frameworks" \
            -p "@executable_path/../Frameworks/"

          codesign --deep --force --sign - "$APP"

          ln -s /Applications "$PWD/dmg-stage/Applications"
          mkdir -p out/assets
          hdiutil create -volname "C-Cord ${VER}" -srcfolder "$PWD/dmg-stage" -ov -format UDZO \
            "out/assets/C-Cord-${VER}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: out/

  build-android:
    name: Android (Signed APKs + Custom F-Droid Repo)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Android & F-Droid build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config autoconf automake libtool nasm yasm \
            python3 python3-venv python3-pip curl unzip
          # Install NDK r27 if not already present on the runner
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_CAND="$(ls -d "$SDK"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$NDK_CAND" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;35.0.0"
            NDK_CAND="$SDK/ndk/27.2.12479018"
          else
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" || true
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_CAND" >> "$GITHUB_ENV"
          # Install official fdroidserver in an isolated venv
          python3 -m venv /tmp/fdroid-venv
          /tmp/fdroid-venv/bin/pip install --upgrade pip fdroidserver
          echo "/tmp/fdroid-venv/bin" >> "$GITHUB_PATH"
      - name: Cache cross-compiled Android native dependencies
        uses: actions/cache@v4
        with:
          path: |
            android/deps/prefix
            android/deps/stamps
            android/deps/cacert.pem
            android/deps/sdl3-java
          key: android-deps-ndk27-${{ hashFiles('android/scripts/build_deps.sh') }}
      - name: Cache Gradle modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
          key: android-gradle-${{ hashFiles('android/settings.gradle.kts', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'android/gradle.properties') }}
          restore-keys: |
            android-gradle-
      - name: Cross-compile Android native dependencies (arm64-v8a & x86_64)
        run: |
          ./android/scripts/build_deps.sh arm64-v8a 28
          ./android/scripts/build_deps.sh x86_64 28
      - name: Build signed Android APKs (arm64, x86_64, universal) & F-Droid repo metadata
        env:
          VER: ${{ needs.meta.outputs.version }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_STORE_PASSWORD: ${{ secrets.FDROID_STORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out/assets /tmp/ccord-keys
          chmod 700 /tmp/ccord-keys

          if [ -n "${ANDROID_KEYSTORE_B64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > /tmp/ccord-keys/release.jks
            chmod 600 /tmp/ccord-keys/release.jks
            export CCORD_ANDROID_KEYSTORE=/tmp/ccord-keys/release.jks
            export CCORD_ANDROID_STORE_PASS="${ANDROID_STORE_PASSWORD}"
            export CCORD_ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-ccord-release}"
            export CCORD_ANDROID_KEY_PASS="${ANDROID_KEY_PASSWORD:-${ANDROID_STORE_PASSWORD}}"
            export CCORD_REQUIRE_RELEASE_SIGNING=1
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not configured; APKs will be debug-signed! Run android/scripts/gen_signing_keys.sh to configure persistent release signing."
          fi

          ./android/scripts/build_apk.sh \
            --release \
            --splits \
            --version="${VER}" \
            --out-dir="$PWD/out/assets"

          if [ -n "${FDROID_KEYSTORE_B64}" ]; then
            printf '%s' "${FDROID_KEYSTORE_B64}" | base64 -d > /tmp/ccord-keys/fdroid.jks
            chmod 600 /tmp/ccord-keys/fdroid.jks
            ./android/scripts/build_fdroid_repo.sh \
              --apks-dir="$PWD/out/assets" \
              --out="$PWD/out/assets/ccord-fdroid-repo.tar.gz" \
              --repo-url="https://c-cord.org/repo/fdroid/repo" \
              --keystore=/tmp/ccord-keys/fdroid.jks \
              --store-pass="${FDROID_STORE_PASSWORD}" \
              --key-alias="${FDROID_KEY_ALIAS:-ccord-fdroid-repo}" \
              --key-pass="${FDROID_KEY_PASSWORD:-${FDROID_STORE_PASSWORD}}"
          else
            echo "::warning::FDROID_KEYSTORE_B64 secret is not configured; skipping ccord-fdroid-repo.tar.gz generation. Run android/scripts/gen_signing_keys.sh to configure F-Droid signing."
          fi

          rm -rf /tmp/ccord-keys
          ls -lh out/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/

  publish:
    name: Publish GitHub Release & Sync c-cord.org Repos
    needs: [meta, build-arch, build-deb, test-deb, build-rpm, build-appimage, build-flatpak, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Assemble assets, repo metadata & SHA256SUMS
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files repo-meta-combined
          find all-artifacts -path '*/assets/*' -type f -exec cp -v {} release-files/ \;
          for sub in arch deb rpm; do
            for d in all-artifacts/*/repo-meta/"$sub"; do
              if [ -d "$d" ]; then
                mkdir -p "repo-meta-combined/$sub"
                cp -a "$d/." "repo-meta-combined/$sub/"
              fi
            done
          done
          tar -czf release-files/ccord-repo-meta.tar.gz -C repo-meta-combined .
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          ls -lh release-files/

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" release-files/* \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "C-Cord ${TAG}" \
              --generate-notes
          fi
      - name: Announce release to c-cord.org (zero-secret OIDC)
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          # Wait briefly for GitHub's public Releases API edge cache to reflect the new/updated release.
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          sleep 2
          OIDC_TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://plugins.c-cord.org" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          RESP=$(curl -fsSL -X POST "https://c-cord.org/api/v1/releases/announce" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json")
          echo "Announce response: ${RESP}"
